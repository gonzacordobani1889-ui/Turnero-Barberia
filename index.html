<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla Universal PyMEs - Reservas</title>
    
    <!-- 1. ACÁ INYECTAMOS TAILWIND DESDE INTERNET -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. CONFIGURAMOS TUS COLORES PERSONALIZADOS -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appBg: '#0f1015',      /* Fondo súper oscuro */
                        cardBg: '#181921',     /* Fondo de las tarjetas */
                        accent: '#8b5cf6',     /* Tu violeta principal */
                        textMuted: '#8a8a98'   /* Textos secundarios */
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-appBg text-white min-h-screen">

    <!-- CABECERA -->
    <header class="flex justify-between items-center p-6 border-b border-gray-800">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-gray-900 border border-gray-700 rounded-full flex items-center justify-center font-bold">
                LOGO
            </div>
            <div>
                <h2 class="font-bold text-lg leading-tight">Nombre_PyME</h2>
                <span class="text-xs text-textMuted tracking-widest">RESERVAS ONLINE</span>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="max-w-3xl mx-auto p-6 mt-6">
        
        <!-- BARRA DE PROGRESO (STEPPER) -->
        <div class="flex items-center justify-center gap-4 mb-10">
            <div class="flex flex-col items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-accent text-white flex items-center justify-center text-sm font-bold">✓</div>
                <span class="text-[10px] font-bold text-accent tracking-wider">BARBERO</span>
            </div>
            <div class="w-12 h-px bg-gray-700 mb-5"></div>
            <div class="flex flex-col items-center gap-2">
                <div class="w-8 h-8 rounded-full border border-textMuted text-textMuted flex items-center justify-center text-sm font-bold">2</div>
                <span class="text-[10px] font-bold text-textMuted tracking-wider">FECHA</span>
            </div>
            <div class="w-12 h-px bg-gray-700 mb-5"></div>
            <div class="flex flex-col items-center gap-2">
                <div class="w-8 h-8 rounded-full border border-textMuted text-textMuted flex items-center justify-center text-sm font-bold">3</div>
                <span class="text-[10px] font-bold text-textMuted tracking-wider">DATOS</span>
            </div>
        </div>

        <!-- TARJETA DEL PROFESIONAL -->
        <div class="bg-cardBg border border-gray-800 rounded-2xl p-8 transition hover:border-gray-700 cursor-pointer">
            <div class="flex items-center gap-4 mb-6">
                <img src="https://ui-avatars.com/api/?name=Facu+Colito&background=222&color=fff" class="w-12 h-12 rounded-lg">
                <h3 class="font-bold text-xl">Facu (Colito)</h3>
            </div>
            
            <!-- LISTA DE SERVICIOS ADENTRO DE LA TARJETA -->
            <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center p-4 rounded-xl border border-gray-800 hover:bg-gray-800/50 transition">
                    <div>
                        <h4 class="font-semibold text-lg">Corte</h4>
                        <span class="text-sm text-textMuted">30 min</span>
                    </div>
                    <span class="font-bold text-accent text-lg">$14.000</span>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
